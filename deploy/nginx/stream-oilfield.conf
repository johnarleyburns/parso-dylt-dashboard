# SNI-based TLS passthrough for co-hosting oilfield alongside fast-insurance-portal.
#
# Install: copy to /etc/nginx/modules-enabled/ is NOT correct — this is a `stream`
# block, which must live in the top-level nginx.conf (outside `http {}`).
# The cohost-bootstrap.sh script appends this via an include in /etc/nginx/nginx.conf:
#
#     stream { include /etc/nginx/stream.d/oilfield.conf; }
#
# nginx reads the TLS ClientHello SNI without decrypting, then forwards the raw
# stream to the matching backend. Each app keeps terminating its own TLS cert, so
# Cloudflare "Full" continues to work unchanged. Default backend = crm (fail-safe).

map $ssl_preread_server_name $oilfield_upstream {
    oilfield-dash.parso.guru   127.0.0.1:8444;   # oilfield-solo
    default                     127.0.0.1:8443;   # crm (fast-insurance-portal)
}

server {
    listen 443;
    listen [::]:443;
    proxy_pass       $oilfield_upstream;
    ssl_preread      on;
    proxy_timeout    75s;
    proxy_connect_timeout 5s;
}
